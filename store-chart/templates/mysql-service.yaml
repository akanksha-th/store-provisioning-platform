apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: {{ .Values.storeId }}
  labels:
    app: mysql
    store-id: {{ .Values.storeId }}
spec:
  type: ClusterIP
  selector:
    app: mysql
    store-id: {{ .Values.storeId }}
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql