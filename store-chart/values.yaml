# Default values for store-chart
storeId: "store-default"
environment: "local"

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  rootPassword: "rootpassword"
  database: "wordpress"
  user: "wordpress"
  password: "wordpress"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: ""

wordpress:
  image:
    repository: wordpress
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: false
    storageClass: ""
    size: "5Gi"

service:
  type: NodePort
  port: 80

ingress:
  enabled: false
  host: ""
  tls: false

woocommerce:
  enabled: true
  storeName: "My WooCommerce Store"
  adminUser: "admin"
  adminPassword: "admin123"
  adminEmail: "admin@example.com"